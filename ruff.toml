line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: each rule the family config still finds here, and its places today.
    "PLR0913",  # 62
    "PLR0917",  # 23
    "RUF059",  # 23
    "RUF002",  # 6
    "RUF001",  # 7
    "C402",  # 11
    "C408",  # 7
    "RUF003",  # 1
    "PLR0911",  # 2
    "SIM105",  # 3
    "PT006",  # 5
    "PLR0915",  # 3
    "RUF046",  # 2
    "E731",  # 1
]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PLR0913", "PLR0917", "RUF059", "RUF002", "RUF001", "C402", "C408", "RUF003", "PLR0911", "SIM105", "PT006", "PLR0915", "RUF046", "E731"]

[lint.per-file-ignores]
"**/vulture_whitelist.py" = ["B018", "F821"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]

[format]
quote-style = "double"
