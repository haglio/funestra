# The family's merge gate, published once in haglio/.github; this file says only what
# differs about this repo. The check the merge queue requires is `full-suite / suite`.
name: merge gate (full suite)

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      # No siblings cloned: both are pinned in pyproject, so pip fetches the
      # tags this repo was built against.
      siblings: ""
      python-version: "3.14"
      # Six for the suite; the rest is the libmpv fetch below -- a 32 MB download
      # and an extraction, and a job that runs past its clock is cancelled and
      # reports nothing at all.
      timeout-minutes: 8
      # tests/test_dead_code.py reads the apps: every caller of this package
      # lives in another repo, so the scan reads fun_time and origenerator
      # beside the checkout as its callers, and with nothing beside it can
      # only skip. Cloned and not installed -- the scan reads their source, and
      # installing two applications to read it would cost more than the whole
      # suite.
      #
      # Then the engine itself, at the pin: `tools/libmpv.lock` is the digest every
      # app in the family stands on, and until this line nothing ever downloaded it
      # -- `--require` finds the DLL already there on a developer's machine, and no
      # gate fetched it. The recorded digest matched no file at all for a fortnight.
      prepare: |
        set -euo pipefail
        for repo in fun_time origenerator; do
          git clone --quiet --depth 1 "https://github.com/haglio/$repo.git" "../$repo"
        done
        python tools/fetch_libmpv.py --require

  # The retired Genau repository's checks of itself, run against the candidate.
  # Nothing in them needs this package any more; the job goes once
  # `consumer / suite` comes off the merge queue's required checks.
  consumer:
    uses: haglio/.github/.github/workflows/merge-gate.yml@main
    with:
      repo: genau
      siblings: "app_support shared_ui"
      python-version: "3.14"
      timeout-minutes: 15
      sdl-video: dummy

  # Fun Time's and Origenerator's whole suites, with the candidate installed over their
  # own pins: haglio/.github's apps-import.yml says how, once for every library. The
  # scan above reads only the names the apps import: on 2026-10-14 v0.1.507 dropped
  # two entries of a table Fun Time built its commands from, and on 2026-10-17 #263
  # asked the engines the apps hand a Funestra for more than Origenerator's tests'
  # engine answered, and the scan passed both.
  apps:
    uses: haglio/.github/.github/workflows/apps-import.yml@main

  # A version for each landing, so the apps that run this one can pin the copy
  # they were built against. The tag is the version: pyproject reads it with
  # setuptools-scm.
  tag:
    if: github.event_name == 'push'
    needs: full-suite
    uses: haglio/.github/.github/workflows/tag-the-landing.yml@main
    permissions:
      contents: write
