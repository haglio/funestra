[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "funestra"
# The version is the tag on the landing, read by setuptools-scm, so the three
# apps that run this one can name the copy they were built against. Written
# down it said 0.1.0 for the life of the repo.
dynamic = ["version"]
# The version every gate runs, and the one the family's machine runs: a floor
# lower than what a run proves is a promise nothing backs.
requires-python = ">=3.14"
# Every requirement carries a ceiling: without one each run installs whatever
# PyPI served that morning, which is how the family's gates came to run a major
# version of the imaging stack past the one the machines have. Floors are what
# the consumer venvs hold today.
# app_support and shared_ui are not among them: every app that runs this pins
# both itself, and pip refuses two pins of one repo that differ, so a pin here held
# every app to this repo's copies until this repo released again. The copies this
# repo's own suite runs are named in the dev extra, never left to whatever
# checkouts sit beside it.
dependencies = [
    "numpy>=2.4,<3",
    "pillow>=12,<13",
    "python-mpv>=1,<2",
]

# The version is `git describe` of the checkout being built: a landing's tag
# exactly, and that tag plus a development suffix for a checkout past one.
[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "app-support @ git+https://github.com/haglio/app_support@v0.1.336",
    "shared-ui @ git+https://github.com/haglio/shared_ui@v0.1.293",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "ruff==0.16.6",
    "vulture>=2.16,<3",
    # The suite's, not the package's: the HUD paint tests read the family's
    # colors, and `shared_ui.colors` builds them out of QColor. Nothing funestra
    # ships imports Qt, so it stays out of [project.dependencies] and the three
    # apps that install this package do not get a Qt wheel with it.
    "PyQt6>=6,<7",
]

# Consumers install this editable from a local path (see README); it is never
# published, so it must not appear in their own [project.dependencies] — pip
# would go looking for it on PyPI.
# The family checkouts this one is installed beside. shared_ui is a hard
# import-time dependency of both HUDs and was declared nowhere: a fresh venv
# that forgot it died on the first HUD import while this file said the package
# needed numpy, pillow and python-mpv. It cannot go in [project.dependencies]
# -- neither sibling is published, so pip would look for them on PyPI -- so
# this is the record, and the family's dependency gate holds it against the tree.
[tool.haglio]
siblings = ["app_support", "shared_ui"]

# What the family's gates (app_support.gates) let stand here, each for the
# reason beside it. An entry nothing is reported for any more fails the gate.
[tool.haglio.dead-code]
# Every caller of this package lives outside it, so the apps beside this
# checkout are read with its tests, and what they use counts as used.
apps-are-callers = true
# The broker's contract names the folder Fun Time starts the tray from; whether
# a HUD may grow on hover is read only by comparing one drawn HUD with the next.
unread-dataclass-fields = ["BrokerContract.package_dir", "_DrawnWith.may_grow_on_hover"]

[tool.setuptools.packages.find]
include = ["funestra*"]

# The learned motion's trained model ships inside the package: numbers only,
# built by tools/train_learned_motion.py from a corpus that lives outside
# every repo.
[tool.setuptools.package-data]
funestra = ["learned_motion.json.gz", "tiles.glsl"]

[tool.pytest.ini_options]
# The content guard's tracked-tree check comes from app_support, not a copy
# kept here; a `-p` that cannot be imported fails the run outright, which is
# the answer wanted from a checkout that has stopped being guarded.
#
# The timeout is a ceiling on a hang, not a performance budget. The slowest
# test on a developer machine is that tracked-tree content scan, but it is not
# the slowest on a runner: it returns early when no blocklist is reachable, and
# the blocklist is git-ignored, so a fresh checkout has none.
# --timeout-method=thread is the half that pays for itself: it dumps the stack
# of the test that stopped, which turns a stalled required check into a
# one-line diagnosis.
# app_support.gates holds all three halves of it.
addopts = "-p no:cacheprovider -p app_support.sanitize.pytest_plugin -p app_support.gates.pytest_plugin -p app_support.coverage_gate --cov --cov-report= --timeout=60 --timeout-method=thread"
testpaths = ["tests"]
